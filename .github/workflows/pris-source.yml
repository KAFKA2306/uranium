name: IAEA PRIS source

on:
  pull_request:
    paths:
      - 'src/collect_pris.py'
      - 'test_pris.py'
      - '.github/workflows/pris-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Trace PRIS country-statistics service
        run: |
          python - <<'PY'
          import re
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen
          from src.collect_pris import fetch_country

          raw, _ = fetch_country("US")
          html = raw.decode("utf-8", errors="replace")
          scripts = re.findall(r'<script[^>]+src=["\']([^"\']+)', html, flags=re.I)
          for src in scripts:
              if "main" not in src.lower():
                  continue
              script_url = urljoin("https://pris-stats.iaea.org/", src)
              req = Request(script_url, headers={"User-Agent": "Mozilla/5.0"})
              with urlopen(req, timeout=60) as response:
                  js = response.read().decode("utf-8", errors="replace")
              for needle in (
                  "getCountryStatistics(){",
                  "getCountryStatistics(",
                  "countryStatisticsService",
                  "getCountries(){",
                  "reactorList",
              ):
                  start = 0
                  hits = 0
                  while hits < 10:
                      index = js.find(needle, start)
                      if index < 0:
                          break
                      print("TRACE", needle, js[max(0, index - 1800): index + 3000])
                      start = index + len(needle)
                      hits += 1
          PY
      - name: Compile current collector
        run: python -m py_compile src/collect_pris.py
