name: IAEA PRIS source

on:
  pull_request:
    paths:
      - 'src/collect_pris.py'
      - 'test_pris.py'
      - '.github/workflows/pris-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit test
        run: python -c "import test_pris as t; t.test_parse_pris_reactor_table()"
      - name: Inspect current PRIS application endpoints
        run: |
          python - <<'PY'
          import re
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen
          from src.collect_pris import fetch_country

          raw, url = fetch_country("US")
          html = raw.decode("utf-8", errors="replace")
          scripts = re.findall(r'<script[^>]+src=["\']([^"\']+)', html, flags=re.I)
          print("page", url, "bytes", len(raw))
          print("scripts", scripts)
          for src in scripts:
              if "main" not in src.lower():
                  continue
              script_url = urljoin("https://pris-stats.iaea.org/", src)
              req = Request(script_url, headers={"User-Agent": "Mozilla/5.0"})
              with urlopen(req, timeout=60) as response:
                  js = response.read().decode("utf-8", errors="replace")
              print("main_js", script_url, "bytes", len(js))
              candidates = sorted(set(re.findall(r'https?://[^"\' ]+|/[A-Za-z0-9_.?=&/-]*api[A-Za-z0-9_.?=&/-]*', js, flags=re.I)))
              for candidate in candidates[:100]:
                  print("candidate", candidate[:500])
          PY
      - name: Fetch current PRIS country pages
        run: python src/collect_pris.py --country US --country JP --output /tmp/pris-reactors.json
