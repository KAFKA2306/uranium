name: IAEA PRIS source

on:
  pull_request:
    paths:
      - 'src/collect_pris.py'
      - 'test_pris.py'
      - '.github/workflows/pris-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect PRIS reactor-units call site
        run: |
          python - <<'PY'
          import re
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen
          from src.collect_pris import fetch_country

          raw, _ = fetch_country("US")
          html = raw.decode("utf-8", errors="replace")
          scripts = re.findall(r'<script[^>]+src=["\']([^"\']+)', html, flags=re.I)
          for src in scripts:
              if "main" not in src.lower():
                  continue
              script_url = urljoin("https://pris-stats.iaea.org/", src)
              req = Request(script_url, headers={"User-Agent": "Mozilla/5.0"})
              with urlopen(req, timeout=60) as response:
                  js = response.read().decode("utf-8", errors="replace")
              needle = "/countrystatistics/reactor-units"
              start = 0
              while True:
                  index = js.find(needle, start)
                  if index < 0:
                      break
                  print("CALLSITE", js[max(0, index - 1200): index + 1200])
                  start = index + len(needle)
          PY
      - name: Probe candidate PRIS endpoint
        run: |
          python - <<'PY'
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen
          urls = [
              "https://pris.iaea.org/webapi/countrystatistics/reactor-units",
              "https://pris.iaea.org/webapi/countrystatistics/reactor-units?countryCode=US",
              "https://pris.iaea.org/webapi/countrystatistics/reactor-units?country=US",
          ]
          for url in urls:
              try:
                  req = Request(url, headers={"User-Agent": "Mozilla/5.0", "Accept": "application/json"})
                  with urlopen(req, timeout=30) as response:
                      body = response.read()
                      print("PROBE", response.status, response.headers.get("content-type"), url, body[:2000])
              except HTTPError as exc:
                  print("PROBE", exc.code, exc.headers.get("content-type"), url, exc.read()[:1000])
              except Exception as exc:
                  print("PROBE_ERROR", url, repr(exc))
          PY
      - name: Compile current collector
        run: python -m py_compile src/collect_pris.py
