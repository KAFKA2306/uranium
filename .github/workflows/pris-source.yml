name: IAEA PRIS source

on:
  pull_request:
    paths:
      - 'src/collect_pris.py'
      - 'test_pris.py'
      - '.github/workflows/pris-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect PRIS reactor API strings
        run: |
          python - <<'PY'
          import re
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen
          from src.collect_pris import fetch_country

          raw, _ = fetch_country("US")
          html = raw.decode("utf-8", errors="replace")
          scripts = re.findall(r'<script[^>]+src=["\']([^"\']+)', html, flags=re.I)
          for src in scripts:
              if "main" not in src.lower():
                  continue
              script_url = urljoin("https://pris-stats.iaea.org/", src)
              req = Request(script_url, headers={"User-Agent": "Mozilla/5.0"})
              with urlopen(req, timeout=60) as response:
                  js = response.read().decode("utf-8", errors="replace")
              strings = re.findall(r'["\']([^"\']{2,180})["\']', js)
              terms = ("reactor", "country", "plant", "npp", "status", "statistics")
              candidates = sorted({s for s in strings if any(t in s.lower() for t in terms)})
              for value in candidates[:400]:
                  print("string", value)
          PY
      - name: Compile current collector
        run: python -m py_compile src/collect_pris.py
