name: Deploy Pages

on:
  pull_request:
    paths:
      - web/**
      - api/v1/nuclear-power/**
      - .github/workflows/pages.yml
  push:
    branches: [main]
    paths:
      - web/**
      - api/v1/nuclear-power/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate fleet and event boundaries
        run: |
          python -m json.tool api/v1/nuclear-power/capacity.json >/dev/null
          python -m json.tool api/v1/nuclear-power/by-status.json >/dev/null
          python -m json.tool api/v1/nuclear-power/by-country.json >/dev/null
          python -m json.tool api/v1/nuclear-power/status-events-2026.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('api/v1/nuclear-power')
          cap=json.loads((root/'capacity.json').read_text())
          status=json.loads((root/'by-status.json').read_text())
          events=json.loads((root/'status-events-2026.json').read_text())
          assert cap['operating']['status']=='Operational'
          assert cap['under_construction']['status']=='Under Construction'
          assert cap['suspended_operation']['status']=='Suspended Operation'
          by={x['status']:x for x in status['groups']}
          assert by['Operational']['reactor_count']==cap['operating']['reactor_count']
          assert by['Under Construction']['reactor_count']==cap['under_construction']['reactor_count']
          assert events['events'] and events['event_count']==len(events['events'])
          assert all(x['source_url'] and x['event_at'] and x['source_field'] for x in events['events'])
          html=Path('web/index.html').read_text()
          for marker in ('Latest verified milestone','Under construction','Verified 2026 milestones','Capacity is not generation'):
              assert marker in html, marker
          start=html.index('<script type="module">')+len('<script type="module">')
          end=html.index('</script>',start)
          Path('/tmp/dashboard.mjs').write_text(html[start:end])
          PY
          node --check /tmp/dashboard.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build Pages artifact from canonical API
        run: |
          mkdir -p web/api/v1
          rm -rf web/api/v1/nuclear-power
          cp -R api/v1/nuclear-power web/api/v1/nuclear-power
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('web/deployment.json').write_text(json.dumps({'source_commit':os.environ['GITHUB_SHA']},indent=2)+'\n')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify exact deployed revision and canonical surface
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import json, os, time
          from urllib.parse import urljoin
          from urllib.request import urlopen
          base=os.environ['PAGE_URL']; expected=os.environ['GITHUB_SHA']; last=None
          for _ in range(30):
              try:
                  with urlopen(urljoin(base,'deployment.json'),timeout=10) as r: dep=json.load(r)
                  with urlopen(urljoin(base,'api/v1/nuclear-power/capacity.json'),timeout=10) as r: cap=json.load(r)
                  with urlopen(base,timeout=10) as r: html=r.read().decode()
                  assert dep['source_commit']==expected
                  assert cap['operating']['reactor_count']>0
                  assert '世界の原子力fleetは' in html and 'Verified 2026 milestones' in html
                  print({'page_url':base,'source_commit':expected,'observed_at':cap['observed_at']})
                  break
              except Exception as exc:
                  last=exc; time.sleep(2)
          else:
              raise SystemExit(f'production verification failed: {last}')
          PY
